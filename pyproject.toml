[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-govinfo-rag"
version = "0.1.0"
description = "Cost-capped BM25, dense, and hybrid RAG comparison for GovInfo documents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "google-cloud-firestore>=2.21,<3",
  "google-cloud-storage>=3.3,<4",
  "google-genai>=1.36,<3",
  "google-auth>=2.40,<3",
  "numpy>=2.2,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
